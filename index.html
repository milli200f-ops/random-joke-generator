<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Joke Generator</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #111827, #1f2937);
        font-family: Arial, sans-serif;
        color: #f9fafb;
      }

      .card {
        width: min(90vw, 600px);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 18px;
        padding: 30px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(10px);
      }

      h1 {
        margin-top: 0;
        text-align: center;
        font-size: 2rem;
      }

      .joke-box {
        min-height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        margin: 20px 0;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.05);
        font-size: 1.1rem;
        line-height: 1.7;
        text-align: center;
      }

      button {
        display: block;
        margin: 0 auto;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #f59e0b, #f97316);
        color: white;
        padding: 12px 22px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.95;
      }

      .loading {
        color: #d1d5db;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Random Joke Generator</h1>
      <div id="joke" class="joke-box loading">Loading a joke...</div>
      <button id="newJokeBtn">Another Joke</button>
    </div>

    <script>
      const jokeEl = document.getElementById("joke");
      const btn = document.getElementById("newJokeBtn");

      async function getJoke() {
        jokeEl.textContent = "Loading a joke...";
        jokeEl.classList.add("loading");

        try {
          const response = await fetch("https://v2.jokeapi.dev/joke/Any?type=single");
          const data = await response.json();

          if (data.error) {
            throw new Error("Could not fetch joke");
          }

          jokeEl.textContent = data.joke;
          jokeEl.classList.remove("loading");
        } catch (error) {
          jokeEl.textContent = "Oops! Something went wrong. Please try again.";
          jokeEl.classList.remove("loading");
        }
      }

      btn.addEventListener("click", getJoke);

      getJoke();
    </script>
  </body>
</html>
