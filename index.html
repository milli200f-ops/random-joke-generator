<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دراسي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">د</div>
          <div class="brand-text">
            <span class="brand-subtitle">منصة التعليم</span>
            <h1>دراسي</h1>
          </div>
        </div>

        <div class="topbar-actions">
          <button class="icon-btn" aria-label="الإشعارات">
            <span class="icon-bell"></span>
          </button>
          <button class="primary-btn" id="openAddSubject">إضافة مادة</button>
        </div>
      </header>

      <main class="main-layout">
        <section class="dashboard">
          <div class="welcome-card">
            <div>
              <p class="eyebrow">مرحبًا بك</p>
              <h2>إدارة دروسك بوضوح وسهولة</h2>
            </div>

            <div class="welcome-meta">
              <span id="welcomeText">3 واجبات قريبة</span>
              <span id="welcomeExam">امتحان اليوم</span>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat-card">
              <span>المواد</span>
              <strong id="statSubjects">0</strong>
            </div>
            <div class="stat-card">
              <span>مكتمل</span>
              <strong id="statCompleted">0</strong>
            </div>
            <div class="stat-card">
              <span>قيد الإنجاز</span>
              <strong id="statProgress">0</strong>
            </div>
            <div class="stat-card">
              <span>قريب</span>
              <strong id="statUpcoming">0</strong>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h3>جدول الدروس</h3>
              <span>هذا الأسبوع</span>
            </div>
            <div id="scheduleList" class="schedule-table"></div>
          </div>
        </section>

        <aside class="side-panel">
          <div class="panel">
            <div class="panel-header">
              <h3>قريبًا</h3>
              <span>تنبيهات</span>
            </div>
            <div id="upcomingList" class="alert-list"></div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h3>المواد</h3>
            </div>
            <div id="subjectList" class="subject-mini-list"></div>
          </div>
        </aside>
      </main>

      <section class="subject-panel">
        <div class="subject-header">
          <div class="subject-header-main">
            <p class="eyebrow">المادة المختارة</p>
            <h2 id="subjectTitle">الرياضيات</h2>
          </div>

          <div class="subject-meta">
            <div class="attendance-box">
              <span class="attendance-label">الحضور</span>
              <strong id="attendanceValue">0</strong>
            </div>
            <button class="primary-btn small" id="openItemModal">إضافة</button>
          </div>
        </div>

        <div class="tabs">
          <button class="tab active" data-tab="assignments">الواجبات</button>
          <button class="tab" data-tab="lessons">الدروس</button>
          <button class="tab" data-tab="exams">الامتحانات</button>
        </div>

        <div class="tab-content active" id="assignmentsTab">
          <div class="list-header">
            <h3>الواجبات</h3>
            <button class="ghost-btn" data-item-type="assignment">إضافة واجب</button>
          </div>
          <div id="assignmentsList" class="task-list"></div>
        </div>

        <div class="tab-content" id="lessonsTab">
          <div class="list-header">
            <h3>الدروس</h3>
            <button class="ghost-btn" data-item-type="lesson">تسجيل درس</button>
          </div>
          <div id="lessonsList" class="lesson-list"></div>
        </div>

        <div class="tab-content" id="examsTab">
          <div class="list-header">
            <h3>الامتحانات</h3>
            <button class="ghost-btn" data-item-type="exam">إضافة امتحان</button>
          </div>
          <div id="examsList" class="exam-list"></div>
        </div>
      </section>
    </div>

    <div class="modal hidden" id="subjectModal">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="subjectModalTitle">إضافة مادة</h3>
          <button class="close-btn" id="closeSubjectModal" aria-label="إغلاق">×</button>
        </div>

        <form id="subjectForm">
          <input type="hidden" id="subjectId" />

          <label>
            اسم المادة
            <input type="text" id="subjectName" placeholder="مثال: العلوم" required />
          </label>

          <label>
            اليوم
            <select id="subjectDay">
              <option>الاثنين</option>
              <option>الثلاثاء</option>
              <option>الأربعاء</option>
              <option>الخميس</option>
              <option>الجمعة</option>
            </select>
          </label>

          <label>
            الوقت
            <input type="time" id="subjectTime" value="08:30" />
          </label>

          <label>
            الحضور الحالي
            <input type="number" id="subjectAttendance" min="0" value="0" />
          </label>

          <label>
            العدد الكلي
            <input type="number" id="subjectTotal" min="1" value="20" />
          </label>

          <button class="primary-btn full" type="submit">حفظ</button>
        </form>
      </div>
    </div>

    <div class="modal hidden" id="itemModal">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="itemModalTitle">إضافة</h3>
          <button class="close-btn" id="closeItemModal" aria-label="إغلاق">×</button>
        </div>

        <form id="itemForm">
          <input type="hidden" id="itemType" />
          <input type="hidden" id="itemId" />

          <div id="itemFields"></div>

          <button class="primary-btn full" type="submit">حفظ</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
